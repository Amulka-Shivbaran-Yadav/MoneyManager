spring.application.name=moneymanager

#Mysql configuration
spring.datasource.url=jdbc:mysql://localhost:3306/moneymanagerdb
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

server.servlet.context-path=/api/v1.0

#JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#Email Configuration
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${BREVO_USERNAME}
spring.mail.password=${BREVO_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.from=${MAIL_FROM}

jwt.secret=${JWT_SECRET}

money.manager.frontend.url=${FRONTEND_URL}

app.activation.url=${ACTIVATION_URL}

#if you have a frontend URL property:
#app.activation.url=http://localhost:5173

spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}

